# Copy this file to .github/workflows/scrape.yml (via GitHub web) to run the
# scraper three times a day (08:17 / 12:47 / 17:23 HKT) and commit changed data.
# Odd minutes: GitHub often delays or drops schedules at :00/:30 when busy.
name: scrape
on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "47 4 * * *"
    - cron: "23 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt && python -m playwright install --with-deps chromium
      - run: cd scraper && python -m pytest -q tests
      - run: cd scraper && python run.py
      - name: commit if changed
        run: |
          git config user.name "dingcun-bot"
          git config user.email "dingcun-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
