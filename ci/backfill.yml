name: backfill
on:
  workflow_dispatch:
    inputs:
      since:
        description: "由幾時開始（YYYY-MM）"
        default: "2025-01"
permissions:
  contents: write
# scrape + backfill never overlap, so the second push can't be rejected
concurrency:
  group: data-push
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt && python -m playwright install --with-deps chromium
      - run: cd scraper && python backfill.py --since "${{ inputs.since }}"
      - name: commit if changed
        run: |
          git config user.name "dingcun-bot"
          git config user.email "dingcun-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: backfill history since ${{ inputs.since }}"
          git pull --rebase -X theirs origin main
          git push
